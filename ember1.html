<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ember Animation</title>
<style>
  html,body { height:100%; margin:0; background:#151412; }

  .ember-wrap {
    position:relative;
    width:100%;
    height:60vh;
    overflow:hidden;
    background:#151412;   /* ✨ New background */
  }

  canvas { 
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
  }

  .ember-wrap::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(
                40% 60% at 50% 75%,
                rgba(255,180,110,0.03),
                transparent 20%
              ),
              linear-gradient(
                transparent,
                rgba(0,0,0,0.2)
              );
    mix-blend-mode: soft-light;
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="ember-wrap" id="emberPanel">
  <canvas id="emberCanvas"></canvas>
</div>

<script>
/* ——— same JS as before, unchanged ——— */
</script>

</body>
</html>
