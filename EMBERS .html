<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Embers Animation</title>
    <style>
        body {
            background-color: #1a1a1a; /* Dark background for visibility */
            margin: 0;
            overflow: hidden; /* Hide anything outside the viewport */
            height: 100vh;
            position: relative;
        }

        .ember-container {
            position: absolute;
            bottom: -10%; /* Start just below the screen */
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to go through to content below (if any) */
        }

        .ember {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff6a00, #e94b3c, #1a1a1a 80%); /* Orange/Red glow */
            border-radius: 50%;
            opacity: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                opacity: 0;
                transform: translateY(0); /* Start position */
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                opacity: 0;
                transform: translateY(110vh); /* End position (just past the bottom) */
            }
        }
    </style>
</head>
<body>

    <div class="ember-container">
        <!-- Embers will be generated by JavaScript below -->
    </div>

    <script>
        const container = document.querySelector('.ember-container');
        const numEmbers = 50; // Number of embers

        for (let i = 0; i < numEmbers; i++) {
            const ember = document.createElement('div');
            ember.classList.add('ember');

            // Randomize size (between 2px and 6px)
            const size = Math.random() * 4 + 2;
            ember.style.width = `${size}px`;
            ember.style.height = `${size}px`;

            // Randomize starting horizontal position
            ember.style.left = `${Math.random() * 100}%`;

            // Randomize animation duration (slow falling speed: 10s to 30s)
            ember.style.animationDuration = `${Math.random() * 20 + 10}s`;

            // Randomize animation delay so they don't all start at once
            ember.style.animationDelay = `${Math.random() * 30}s`;

            container.appendChild(ember);
        }
    </script>
</body>
</html>
